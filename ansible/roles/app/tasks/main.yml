---
# tasks file for app
- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write secret files from vault
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ project_dir }}/secrets/{{ item.name }}.txt"
    owner: root
    group: root
    mode: "0400"
  loop:
    - { name: db_password, value: "{{ db_password }}" }
    - { name: user_password, value: "{{ wp_admin_password }}" }
    - { name: db_root_password, value: "{{ db_root_password }}" }
  no_log: true

- name: Create project and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ project_dir }}"
    - "{{ data_dir }}/mariadb"
    - "{{ data_dir }}/wordpress"

- name: Copy build contexts 
  ansible.builtin.copy:
    src: requirements/
    dest: "{{ project_dir }}/requirements/"

- name: Generate .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: "0600"

- name: Generate docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: "0644"

# secrets: to be discussed, task goes here

- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    build: always      # or "policy" if you want fewer rebuilds
    state: present