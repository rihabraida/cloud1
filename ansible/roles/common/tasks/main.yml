---
# tasks file for roles/common
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600     # skip if updated in the last hour

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present # for idempotency, ensures package is installed