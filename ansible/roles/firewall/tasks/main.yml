---
# tasks file for roles/firewall
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH, HTTP, HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]

- name: Deny all other incoming by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable UFW
  community.general.ufw:
    state: enabled