---
- name: Point DuckDNS at this server
  ansible.builtin.uri:
    url: "https://www.duckdns.org/update?domains={{ domain }}&token={{ duckdns_token }}&ip="
    return_content: true
  register: duckdns
  failed_when: "'OK' not in duckdns.content"
  changed_when: false
  no_log: true

- name: Wait until the domain resolves
  ansible.builtin.command: "getent hosts {{ domain }}"
  register: dns
  until: dns.rc == 0
  retries: 10
  delay: 6
  changed_when: false

- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present

- name: Obtain TLS certificate
  ansible.builtin.command: >
    certbot certonly --standalone --non-interactive --agree-tos
    -m {{ certbot_email }}
    -d {{ domain }}
    --cert-name cloud1
    --pre-hook "docker stop nginx || true"
    --post-hook "docker start nginx || true"
    {{ '--test-cert' if certbot_staging | default(false) else '' }}
  args:
    creates: "/etc/letsencrypt/live/cloud1/fullchain.pem"